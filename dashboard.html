<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TI Internship Finder - Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 30px;
            text-align: center;
        }
        
        .header h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }
        
        .header p {
            color: #666;
            font-size: 1.1em;
        }
        
        .status-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .status-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border-left: 5px solid #667eea;
        }
        
        .status-card.success {
            border-left-color: #10b981;
        }
        
        .status-card.warning {
            border-left-color: #f59e0b;
        }
        
        .status-card h3 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .status-card .value {
            font-size: 2em;
            font-weight: bold;
            color: #333;
        }
        
        .status-card .subtitle {
            font-size: 0.9em;
            color: #888;
            margin-top: 5px;
        }
        
        .jobs-container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .jobs-header {
            background: #667eea;
            color: white;
            padding: 20px;
            font-size: 1.5em;
            font-weight: bold;
        }
        
        .jobs-loading {
            padding: 40px;
            text-align: center;
            color: #999;
        }
        
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .job-item {
            padding: 20px;
            border-bottom: 1px solid #eee;
            transition: background 0.3s;
        }
        
        .job-item:hover {
            background: #f9f9f9;
        }
        
        .job-title {
            font-size: 1.2em;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }
        
        .job-company {
            color: #667eea;
            font-weight: bold;
            margin-bottom: 8px;
        }
        
        .job-meta {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            font-size: 0.9em;
            color: #666;
            margin-bottom: 10px;
        }
        
        .job-badge {
            background: #f0f0f0;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85em;
        }
        
        .job-badge.remoto {
            background: #d4edda;
            color: #155724;
        }
        
        .job-badge.hibrido {
            background: #fff3cd;
            color: #856404;
        }
        
        .job-desc {
            color: #666;
            margin-bottom: 10px;
            font-style: italic;
        }
        
        .job-link {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 8px 16px;
            border-radius: 5px;
            text-decoration: none;
            font-size: 0.9em;
            transition: background 0.3s;
        }
        
        .job-link:hover {
            background: #5568d3;
        }
        
        .empty-state {
            padding: 40px;
            text-align: center;
            color: #999;
        }
        
        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            opacity: 0.5;
        }
        
        .refresh-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            transition: background 0.3s;
            margin: 10px;
        }
        
        .refresh-btn:hover {
            background: #5568d3;
        }
        
        .controls {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .last-update {
            padding: 20px;
            background: #f9f9f9;
            text-align: center;
            color: #666;
            font-size: 0.9em;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 TI Internship Finder</h1>
            <p>Dashboard de Vagas de Estágio em Tecnologia</p>
        </div>
        
        <div class="status-bar" id="statusBar">
            <div class="status-card">
                <h3>📊 Total de Vagas</h3>
                <div class="value" id="totalJobs">-</div>
                <div class="subtitle">encontradas no banco de dados</div>
            </div>
            <div class="status-card warning">
                <h3>⏱️ Última Atualização</h3>
                <div class="value" id="lastUpdate">-</div>
                <div class="subtitle">status do sistema</div>
            </div>
        </div>
        
        <div class="controls">
            <button class="refresh-btn" onclick="loadJobs()">🔄 Atualizar Agora</button>
        </div>
        
        <div class="jobs-container">
            <div class="jobs-header">📋 Vagas Disponíveis</div>
            <div id="jobsList" class="jobs-loading">
                <div class="spinner"></div>
                <p>Carregando vagas...</p>
            </div>
        </div>
        
        <div class="last-update" style="margin-top: 20px;">
            <p>Auto-atualiza a cada 5 segundos. Para sair do agendador, pressione Ctrl+C no terminal.</p>
        </div>
    </div>
    
    <script>
        async function loadJobs() {
            try {
                // Carregar status
                const statusResponse = await fetch('/api/status');
                const statusData = await statusResponse.json();
                
                document.getElementById('totalJobs').textContent = statusData.total_vagas;
                document.getElementById('lastUpdate').textContent = new Date(statusData.timestamp).toLocaleTimeString('pt-BR');
                
                // Carregar vagas
                const jobsResponse = await fetch('/api/jobs');
                const jobsData = await jobsResponse.json();
                
                const jobsList = document.getElementById('jobsList');
                
                if (jobsData.jobs.length === 0) {
                    jobsList.innerHTML = `
                        <div class="empty-state">
                            <p>Nenhuma vaga encontrada ainda.</p>
                            <p style="font-size: 0.9em; margin-top: 10px;">Execute o programa para começar a buscar vagas.</p>
                        </div>
                    `;
                    return;
                }
                
                let html = '';
                jobsData.jobs.forEach(job => {
                    const tipoBadgeClass = job.tipo.toLowerCase().includes('remoto') ? 'remoto' : (job.tipo.toLowerCase().includes('híbrid') ? 'hibrido' : '');
                    html += `
                        <div class="job-item">
                            <div class="job-title">${job.titulo}</div>
                            <div class="job-company">🏢 ${job.empresa}</div>
                            <div class="job-meta">
                                <span class="job-badge">📍 ${job.localizacao}</span>
                                <span class="job-badge ${tipoBadgeClass}">💼 ${job.tipo}</span>
                                <span class="job-badge">📅 ${new Date(job.data_publicacao).toLocaleDateString('pt-BR')}</span>
                            </div>
                            <div class="job-desc">${job.descricao_resumida || 'Sem descrição'}</div>
                            <a href="${job.link}" target="_blank" class="job-link">Ver Vaga →</a>
                        </div>
                    `;
                });
                
                jobsList.innerHTML = html;
            } catch (error) {
                console.error('Erro ao carregar:', error);
                document.getElementById('jobsList').innerHTML = `
                    <div class="empty-state">
                        <p>❌ Erro ao conectar com o servidor.</p>
                        <p style="font-size: 0.9em; margin-top: 10px;">Certifique-se de que a API está rodando em http://127.0.0.1:8000</p>
                    </div>
                `;
            }
        }
        
        // Carregar ao abrir a página
        loadJobs();
        
        // Auto-atualizar a cada 5 segundos
        setInterval(loadJobs, 5000);
    </script>
</body>
</html>
